services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_API_KEY: ${ELEXON_API_KEY:-}
      CORS_ORIGINS: "*"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls the published API port (works when container-to-container
        # networking is restricted). For Vercel, set VITE_API_BASE to the API origin.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
